project:
  type: book
  output-dir: _site

book:
  title: "ngGONG Software"
  subtitle: "Documentation"
  author: "The ngGONG Software Team"
  date: today
  favicon: assets/ngGONG-Logo.png
  repo-url: https://github.com/nggong/docs
  repo-branch: main
  repo-actions: [edit]
  sidebar:
    logo: assets/ngGONG-Logo.png
    logo-alt: "ngGONG logo"
  chapters:
    - index.md
    - docs/overview.md
    - part: docs/design/index.md
      chapters:
        - docs/design/hls/cdd.md
    - docs/software-development-plan.md
    #- docs/adr/index.md
  page-footer:
    center: |
      © Copyright 2026 Association of Universities for Research in Astronomy, Inc. (AURA).

      The U.S. National Science Foundation (NSF) Next-Generation Ground-based Solar Observing Network (ngGONG) is being designed by the NSF National Solar Observatory (NSO) with funding from NSF. NSO is managed by the Association of Universities for Research in Astronomy, Inc. (AURA), and funded under a cooperative agreement with the NSF.
    border: true

format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    code-copy: true
  pdf:
    documentclass: scrreprt
    toc: true
    number-sections: true
    colorlinks: true

execute:
  freeze: auto
