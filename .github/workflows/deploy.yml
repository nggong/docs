name: Publish Documentation

on:
  workflow_run:
    workflows: [Build Documentation]
    types: [completed]
  # Cleanup uses the trusted workflow on the base branch. Never build PR code here.
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build Documentation run ID to publish (blank for cleanup only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages-publisher
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out trusted publishing tools
        uses: actions/checkout@v6
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Assemble production and PR previews
        id: assemble
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: python3 source/tools/publish-site.py

      - name: Configure GitHub Pages
        if: steps.assemble.outputs.ready == 'true'
        uses: actions/configure-pages@v6

      - name: Upload combined site
        if: steps.assemble.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-store/site

      - name: Deploy to GitHub Pages
        if: steps.assemble.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
