name: Build Documentation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure PR preview
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: python3 tools/preview-config.py

      - name: Render documentation
        run: make all
        env:
          DOCS_PREVIEW: ${{ github.event_name == 'pull_request' && '1' || '' }}

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v5
        with:
          name: nggong-documentation-pdfs
          path: _pdf/**/*.pdf
          if-no-files-found: error

      - name: Upload complete website
        uses: actions/upload-artifact@v5
        with:
          name: documentation-site
          path: _site/
          if-no-files-found: error
